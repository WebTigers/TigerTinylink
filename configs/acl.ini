; TigerTinylink ACL.
;
; Two surfaces:
;   1. The admin screen + its /api service — admin and above, one rule per method (a new method needs a rule).
;   2. The public redirect controller (/l/<slug>) — GUEST on purpose: anyone who follows a short link is
;      anonymous. It only resolves a slug of the SITE's org to that link's stored destination; it accepts no
;      destination from the request, so it can't be used as an open redirect.
[production]

acl.resources.tinylink_admin_ctrl.resource = "Tinylink_AdminController"
acl.resources.tinylink_go_ctrl.resource    = "Tinylink_GoController"
acl.resources.tinylink_link_svc.resource   = "Tinylink_Service_Link"

acl.rules.tinylink_admin.role       = "admin"
acl.rules.tinylink_admin.resource   = "Tinylink_AdminController"
acl.rules.tinylink_admin.permission = "allow"

acl.rules.tinylink_go.role       = "guest"
acl.rules.tinylink_go.resource   = "Tinylink_GoController"
acl.rules.tinylink_go.permission = "allow"

acl.rules.tinylink_svc_datatable.role       = "admin"
acl.rules.tinylink_svc_datatable.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_datatable.privilege  = "datatable"
acl.rules.tinylink_svc_datatable.permission = "allow"

acl.rules.tinylink_svc_get.role       = "admin"
acl.rules.tinylink_svc_get.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_get.privilege  = "get"
acl.rules.tinylink_svc_get.permission = "allow"

acl.rules.tinylink_svc_save.role       = "admin"
acl.rules.tinylink_svc_save.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_save.privilege  = "save"
acl.rules.tinylink_svc_save.permission = "allow"

acl.rules.tinylink_svc_status.role       = "admin"
acl.rules.tinylink_svc_status.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_status.privilege  = "setStatus"
acl.rules.tinylink_svc_status.permission = "allow"

acl.rules.tinylink_svc_delete.role       = "admin"
acl.rules.tinylink_svc_delete.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_delete.privilege  = "delete"
acl.rules.tinylink_svc_delete.permission = "allow"

acl.rules.tinylink_svc_stats.role       = "admin"
acl.rules.tinylink_svc_stats.resource   = "Tinylink_Service_Link"
acl.rules.tinylink_svc_stats.privilege  = "stats"
acl.rules.tinylink_svc_stats.permission = "allow"

; --- links pages: the public page (guest) + the admin screens and their /api services ---
