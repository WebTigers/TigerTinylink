; TigerTinylink public route: /l/<slug> → Tinylink_GoController::indexAction (registered as tinylink__go by
; Tiger_Routing_ModuleRoutes). Change the prefix here if /l/ is taken on your site.
[production]
resources.router.routes.go.route              = "l/:slug"
resources.router.routes.go.defaults.module     = "tinylink"
resources.router.routes.go.defaults.controller = "go"
resources.router.routes.go.defaults.action     = "index"
resources.router.routes.go.reqs.slug           = "[A-Za-z0-9][A-Za-z0-9_-]{0,63}"

[staging : production]

[testing : production]

[development : production]
